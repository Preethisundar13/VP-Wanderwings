<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VP Wander Wings | Travel Ticket Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-wrapper">
        <!-----------------HEADER SECTION----------------->
        <header class="hero">
            <div class="hero-overlay">
                <h1>VP WANDER WINGS</h1>
                <p>
                    Explore India's most beautiful destinations by Flight,
                    Train, or Bus.<br>
                    <a href="#container" class="hero-btn">
                        Login to Continue
                    </a>
                </p>
            </div>
        </header>
        <main>
            <!-----------------LOGIN SECTION----------------->
            <section class="container">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <div class="input-field">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="username" name="username" placeholder="Enter your username" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-field">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-field">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Enter your password"
                                required>
                        </div>
                    </div>
                    <button type="submit" class="btn">
                        Login
                    </button>
                </form>
            </section>
        </main>
        <!---------------------FOOTER-------------------------------------->
        <footer>
            <p> &copy; 2026 VP Wander Wings. All Rights Reserved.</p>
            <p>
                Designed with ❤️ for Travel Enthusiasts.
            </p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
